[theme]
font = "sans serif"
baseRadius = "0.25rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#1D4ED8"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#ECEFF3"
textColor = "#111827"
borderColor = "#D5DAE1"
linkColor = "#1D4ED8"

[theme.dark]
primaryColor = "#7BA4F7"
backgroundColor = "#111418"
secondaryBackgroundColor = "#1A1E24"
textColor = "#E5E7EB"
borderColor = "#2B313A"
linkColor = "#7BA4F7"

[client]
toolbarMode = "viewer"
